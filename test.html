<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>눈치챗 · 다국어 팀플 협업</title>
    <link rel="stylesheet" href="./style.css" />
    <link rel="icon" type="image/png" href="./assets/brand/icon.png" />
    <meta name="theme-color" content="#1F3A5F" />
    <link rel="stylesheet" href="./css/i18n.css" />
    <link rel="stylesheet" href="./css/api.css" />
    <link rel="stylesheet" href="./css/meaning-sheet.css" />
  </head>
  <body data-page="main">
    <div id="api-error" class="api-error" role="alert" hidden>
      <span></span><button type="button" id="retry-api" data-i18n="api.refresh"></button
      ><button type="button" id="dismiss-error" data-i18n-aria-label="close">✕</button>
    </div>
    <div class="shell">
      <aside class="side" id="sidebar">
        <div class="logo">
          <span class="brand-logo"><img src="./assets/brand/logo-light.png" alt="눈치Chat" /></span>
        </div>
        <div class="tagline"><span data-i18n="tagline">다른 언어, 같은 마음으로.</span></div>
        <div class="workspace-label">
          <span><span data-i18n="workspaces">WORKSPACE</span></span
          ><button
            type="button"
            id="create-workspace"
            aria-label="새 워크스페이스 만들기"
            data-i18n-aria-label="createWorkspace"
            title="새 워크스페이스 만들기"
            data-i18n-title="createWorkspace"
          >
            ＋
          </button>
        </div>
        <nav
          id="workspace-list"
          aria-label="워크스페이스 목록"
          data-i18n-aria-label="workspaceList"
        ></nav>
        <nav class="tool-nav" aria-label="일정 및 회의 도구" data-i18n-aria-label="tools.tools">
          <div class="nav-label"><span data-i18n="tools.nav">회의 · 일정</span></div>
          <button type="button" class="nav-btn" data-tool-view="chat">
            <span data-i18n="tools.chat">채팅</span>
          </button>
          <button type="button" class="nav-btn" data-tool-view="receipt">
            <span data-i18n="tools.receipt">합의 영수증</span>
          </button>
          <button type="button" class="nav-btn" data-tool-view="calendar">
            <span data-i18n="tools.calendar">공용 캘린더</span>
          </button>
          <button type="button" class="nav-btn" data-tool-view="todo">
            <span data-i18n="tools.todo">개인 투두</span>
          </button>
        </nav>
        <div class="side-bottom">
          <div class="profile">
            <span class="avatar me" id="profile-avatar"></span>
            <div>
              <strong class="detail-style-3" id="profile-name"></strong
              ><small id="profile-language"></small>
            </div>
          </div>
        </div>
      </aside>
      <main class="main">
        <header class="top">
          <button
            class="mobile-toggle"
            id="menu"
            aria-label="메뉴 열기"
            data-i18n-aria-label="menu"
            aria-expanded="false"
          >
            ☰
          </button>
          <div>
            <div class="breadcrumb" id="breadcrumb">내 워크스페이스 / 3조</div>
            <h1 id="page-title">함께 만드는, 우리 팀 프로젝트</h1>
          </div>
          <label class="ui-language"
            ><span data-i18n="uiLanguage"></span
            ><select
              id="ui-language"
              data-language-select
              aria-label="화면 언어"
              data-i18n-aria-label="uiLanguage"
            >
              <option value="ko">한국어</option>
              <option value="en">English</option>
              <option value="vi">Tiếng Việt</option>
              <option value="de">Deutsch</option>
            </select></label
          >
          <button type="button" class="btn leave-button" id="logout">
            <span data-i18n="api.logout">워크스페이스 나가기</span>
          </button>
        </header>
        <div class="layout" id="chat-view">
          <section class="content">
            <div class="room-bar">
              <strong id="room-title"># 자료조사</strong>
              <div class="room-members">
                <span id="member-count">팀원 4명</span>
                <div class="people" id="member-avatars"></div>
                <button type="button" class="btn invite-button" id="invite-friends">
                  <span data-i18n="inviteFriends">＋ 친구 초대</span>
                </button>
              </div>
              <div class="room-actions">
                <button
                  class="btn primary agreement-create"
                  id="create-card"
                  type="button"
                  aria-haspopup="dialog"
                  aria-controls="agreement-dialog"
                >
                  <span data-i18n="createCard">합의 카드 만들기</span>
                </button>
                <button type="button" class="btn primary" id="settle-agreements">
                  <span data-i18n="tools.settle">중간 결산</span>
                </button>
                <button
                  type="button"
                  class="btn room-leave"
                  id="leave-room"
                  aria-haspopup="dialog"
                  aria-controls="leave-room-dialog"
                  data-i18n="roomLeave.button"
                ></button>
              </div>
            </div>
            <div
              class="messages"
              id="messages"
              role="log"
              aria-label="팀 채팅"
              data-i18n-aria-label="chatLabel"
            ></div>
            <dialog id="meaning-dialog" class="meaning-sheet" aria-labelledby="meaning-title">
              <div class="sheet-grip" aria-hidden="true"></div>
              <header class="meaning-sheet-header">
                <span class="sheet-eyebrow" data-i18n="sheet.before"></span
                ><button type="button" id="close-meaning" data-i18n-aria-label="sheet.edit">
                  ✕
                </button>
              </header>
              <h2 id="meaning-title" data-i18n="meaningTitle"></h2>
              <p class="sheet-description" data-i18n="api.meaningHelp"></p>
              <div id="pending-text" class="sheet-quote"></div>
              <div id="meaning-options"></div>
              <p id="meaning-error" class="api-inline-error" role="alert" hidden></p>
              <footer class="meaning-sheet-footer">
                <span data-i18n="sheet.choose"></span
                ><button
                  type="button"
                  class="btn"
                  id="send-original"
                  data-i18n="sendOriginal"
                ></button>
              </footer>
            </dialog>
            <form class="composer" id="message-form">
              <div class="compose-box">
                <textarea
                  id="message-input"
                  aria-label="메시지 입력"
                  data-i18n-aria-label="messageInput"
                  placeholder="어떤 생각이든 편하게 나눠 보세요."
                  data-i18n-placeholder="messagePlaceholder"
                  required
                ></textarea>
                <div class="compose-bottom">
                  <button class="btn primary" id="send">
                    <span data-i18n="send">보내기 ↑</span>
                  </button>
                </div>
              </div>
              <div class="composer-meta">
                <span id="connection-status" data-i18n="api.connecting"></span>
                <span class="room-language" id="viewing-language"></span>
              </div>
              <div class="hint">
                <span id="translation-hint"></span><span data-i18n="shortcut"></span>
              </div>
            </form>
          </section>
          <aside class="board">
            <div class="eyebrow"><span data-i18n="boardEyebrow">ON THE SAME PAGE</span></div>
            <div class="board-title">
              <h2><span data-i18n="boardTitle">우리 팀 합의 보드</span></h2>
              <span class="counter" id="board-count">0</span>
            </div>

            <div id="board-cards">
              <p class="empty"><span data-i18n="boardEmpty">아직 등록된 합의가 없어요.</span></p>
            </div>
          </aside>
        </div>
        <section
          id="tool-view"
          class="tool-view"
          aria-label="워크스페이스 도구"
          data-i18n-aria-label="tools.workspaceTools"
          hidden
        >
          <div id="tool-content"></div>
        </section>
      </main>
    </div>

    <dialog id="workspace-dialog" aria-labelledby="workspace-dialog-title">
      <div class="modal-title">
        <h2 id="workspace-dialog-title"><span data-i18n="workspaceTitle">새 워크스페이스</span></h2>
        <button type="button" class="close" aria-label="닫기" data-i18n-aria-label="close">
          ✕
        </button>
      </div>
      <p>
        <span data-i18n="workspaceIntro">함께 이야기하고 약속을 정할 공간을 만들어 보세요.</span>
      </p>
      <form id="workspace-form">
        <label class="field"
          ><span data-i18n="workspaceName">워크스페이스 이름</span
          ><input
            id="workspace-name"
            placeholder="예: 마케팅 프로젝트"
            data-i18n-placeholder="workspacePlaceholder"
            required
            maxlength="50"
        /></label>

        <p class="local-note">
          <span data-i18n="api.roomStorage"></span>
        </p>
        <div class="actions modal-actions">
          <button type="button" class="btn close"><span data-i18n="cancel">취소</span></button
          ><button class="btn primary" type="submit">
            <span data-i18n="createAndOpen">만들고 이동하기</span>
          </button>
        </div>
      </form>
      <hr />
      <form id="join-room-form">
        <label class="field"
          ><span data-i18n="api.roomId"></span
          ><input id="join-room-id" inputmode="numeric" pattern="[0-9]+" required
        /></label>
        <p data-i18n="api.joinHelp"></p>
        <button type="submit" class="btn" data-i18n="api.join"></button>
      </form>
    </dialog>
    <dialog id="invite-dialog" aria-labelledby="invite-dialog-title">
      <div class="modal-title">
        <h2 id="invite-dialog-title" data-i18n="api.addMember"></h2>
        <button type="button" class="close" data-i18n-aria-label="close">✕</button>
      </div>
      <p>
        <strong id="invite-workspace-name"></strong> · <span data-i18n="api.roomId"></span>
        <strong id="invite-room-id"></strong>
      </p>
      <p data-i18n="api.memberHelp"></p>
      <form id="invite-form">
        <label class="field"
          ><span data-i18n="api.userId"></span
          ><input id="invite-user-id" inputmode="numeric" pattern="[0-9]+" required
        /></label>
        <div class="actions">
          <button type="submit" class="btn primary" data-i18n="api.addMember"></button>
        </div>
      </form>
      <h3 data-i18n="api.members"></h3>
      <div id="invitation-list"></div>
    </dialog>

    <dialog id="agreement-dialog" aria-labelledby="agreement-heading">
      <h2 id="agreement-heading" data-i18n="createCard"></h2>
      <p class="agreement-description" data-i18n="agreementDescription"></p>
      <form id="agreement-form">
        <label class="field"
          ><span data-i18n="title"></span
          ><input id="agreement-title" required maxlength="80" /></label
        ><label class="field"
          ><span data-i18n="content"></span
          ><textarea id="agreement-text" rows="3" maxlength="500"></textarea>
        </label>
        <div class="agreement-row">
          <label class="field"
            ><span data-i18n="assignee"></span
            ><select id="agreement-assignee" required></select></label
          ><label class="field"
            ><span data-i18n="dueDate"></span><input id="agreement-date" type="date"
          /></label>
        </div>
        <div class="agreement-preview" aria-live="polite">
          <small data-i18n="previewCard"></small><strong id="agreement-preview-title"></strong
          ><small data-i18n="api.serverCard"></small>
        </div>
        <div class="actions agreement-actions">
          <button type="button" class="btn" id="agreement-cancel" data-i18n="cancel"></button
          ><button class="btn primary" type="submit" data-i18n="postCard"></button>
        </div>
      </form>
    </dialog>
    <dialog
      id="leave-room-dialog"
      aria-labelledby="leave-room-title"
      aria-describedby="leave-room-description"
    >
      <div class="modal-title">
        <h2 id="leave-room-title" data-i18n="roomLeave.title"></h2>
        <button type="button" class="close" data-i18n-aria-label="close">✕</button>
      </div>
      <p id="leave-room-name"></p>
      <p id="leave-room-description" data-i18n="roomLeave.description"></p>
      <div class="actions modal-actions">
        <button type="button" class="btn close" autofocus data-i18n="cancel"></button
        ><button
          type="button"
          class="btn room-leave"
          id="confirm-room-leave"
          data-i18n="roomLeave.button"
        ></button>
      </div>
    </dialog>
    <div class="toast" id="toast" role="status" hidden></div>
    <!-- 공통 도구와 상태 → 기능 → 앱 초기화 순으로 실행합니다. -->
    <script src="./js/locales/ko.js"></script>
    <script src="./js/locales/en.js"></script>
    <script src="./js/locales/vi.js"></script>
    <script src="./js/locales/de.js"></script>
    <script src="./js/i18n.js"></script>
    <script src="./js/config.js"></script>
    <script src="./js/user-api.js"></script>
    <script src="./js/utils.js"></script>
    <script src="./js/timeline.js"></script>
    <script src="./js/state.js"></script>
    <script src="./js/toast.js"></script>
    <script src="./js/chat.js"></script>
    <script src="./js/meaning.js"></script>
    <script src="./js/sidebar.js"></script>
    <script src="./js/board.js"></script>
    <script src="./js/invitations.js"></script>
    <script src="./js/realtime.js"></script>
    <script src="./js/tools.js"></script>
    <script src="./js/workspace-leave.js"></script>
    <script src="./script.js"></script>
  </body>
</html>
